
spring.application.name=vacation-booking-api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/vacation_booking
spring.datasource.username=vacation_app
spring.datasource.password=${VACATION_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
